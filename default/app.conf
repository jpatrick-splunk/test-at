# Splunk 10 app identity for ZENTRA Cloud weather collection.

[install]
is_configured = 0
state = enabled
build = 2
python.version = python3

[ui]
is_visible = 1
label = ZENTRA Weather

[launcher]
author = ZENTRA Weather Maintainers
description = Polls ZENTRA Cloud v4 15-minute field logger readings and totals daily and weekly rainfall in Splunk.
version = 1.1.0

[package]
id = zentra_weather
check_for_updates = 0

[id]
name = zentra_weather
version = 1.1.0

[triggers]
reload.inputs = simple
reload.props = simple
reload.transforms = simple
reload.eventtypes = simple
reload.tags = simple
reload.macros = simple
reload.datamodels = simple
