[zentra:weather]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 10000
CHARSET = UTF-8
INDEXED_EXTRACTIONS = json
KV_MODE = none
AUTO_KV_JSON = false
TIMESTAMP_FIELDS = timestamp_utc
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 20
category = Metrics
description = Normalized ZENTRA Cloud v4 field logger weather observations
disabled = false
FIELDALIAS-zentra_lat = latitude AS lat
FIELDALIAS-zentra_lon = longitude AS lon
EVAL-error_flag_int = case(error_flag=="true" OR error_flag=true OR error_flag=1, 1, true(), 0)

[source::zentra_weather://...]
sourcetype = zentra:weather
