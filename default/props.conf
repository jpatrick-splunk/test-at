[zentra:reading]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 10000
CHARSET = UTF-8
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "timestamp_utc":\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 20
category = Metrics
description = ZENTRA Cloud 15-minute measurement readings (original names, values, and units)
disabled = false
FIELDALIAS-zentra_lat = latitude AS lat
FIELDALIAS-zentra_lon = longitude AS lon

