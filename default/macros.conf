[zentra_weather_index]
definition = index=zentra_validate
iseval = 0

[zentra_weather_search]
definition = `zentra_weather_index` (sourcetype=zentra:reading OR sourcetype=zentra:weather)
iseval = 0

[zentra_canonical(1)]
args = canonical
definition = `zentra_weather_search` measurement_canonical=$canonical$
iseval = 0

[zentra_named(1)]
args = name
definition = `zentra_weather_search` measurement="$name$"
iseval = 0

[zentra_interval_precip]
definition = `zentra_named(Precipitation)`
iseval = 0

[zentra_precip_rain]
definition = `zentra_interval_precip` value>0
iseval = 0

[zentra_weather_datamodel]
definition = Weather
iseval = 0

[zentra_with_place]
definition = lookup ranch_places device_sn OUTPUTNEW display_name county | eval place=coalesce(display_name, device_sn)
iseval = 0

[zentra_precip_by_interval]
definition = `zentra_interval_precip` | `zentra_with_place` | stats avg(value) as value by place county device_sn datetime logger_day
iseval = 0
