[zentra_weather]
python.version = python3

[zentra_weather://field_loggers]
disabled = 1
# 900 seconds matches typical ZL6/ATMOS 15-minute measurement intervals.
interval = 900
index = main
sourcetype = zentra:weather
device_sns = z6-30302
api_base_url = https://zentracloud.com
lookback_hours = 168
per_page = 2000
start_by_shell = false
# Set api_token in local/inputs.conf or Splunk Web, or export ZENTRA_API_TOKEN.
# Never store API tokens in default/.
