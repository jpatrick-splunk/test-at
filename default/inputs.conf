[zentra_weather]
python.version = python3

# After the first successful 30-day pull, keep this incremental. Duplicate
# events come from ignore_checkpoint=1 plus a short interval.
[zentra_weather://validate]
disabled = 1
interval = 900
index = zentra_validate
sourcetype = zentra:reading
device_sns = z6-30302
api_base_url = https://zentracloud.com
lookback_hours = 720
output_format = df
ignore_checkpoint = 0
per_page = 2000
start_by_shell = false
# Set api_token in local/inputs.conf or Splunk Web, or export ZENTRA_API_TOKEN.
# Never store API tokens in default/.
