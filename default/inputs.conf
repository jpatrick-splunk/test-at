[zentra_weather]
python.version = python3

# Fresh validation input. Uses a new stanza name so checkpoints do not reuse
# earlier field_loggers state. Disable any previously enabled field_loggers
# stanza in local/inputs.conf before enabling this one.
[zentra_weather://validate]
disabled = 1
# 60 seconds so a failed first poll retries quickly. ZENTRA allows one
# API call per device per minute. Logger samples themselves remain 15 minutes.
interval = 60
index = zentra_validate
sourcetype = zentra:reading
device_sns = z6-30302
api_base_url = https://zentracloud.com
lookback_hours = 720
output_format = df
ignore_checkpoint = 1
per_page = 2000
start_by_shell = false
# Set api_token in local/inputs.conf or Splunk Web, or export ZENTRA_API_TOKEN.
# Never store API tokens in default/.
