# Optional dedicated index for ZENTRA weather events.
# Splunk Cloud / clustered deployments should create the index via their
# usual index-management process instead of this file if policy requires it.

[weather]
homePath   = $SPLUNK_DB/weather/db
coldPath   = $SPLUNK_DB/weather/colddb
thawedPath = $SPLUNK_DB/weather/thaweddb
frozenTimePeriodInSecs = 31536000
repFactor = auto
