# Dedicated index for a clean ZENTRA pull. Do not mix with earlier weather/main
# events until 15-minute values match the ZENTRA Cloud dashboard.
# Splunk Cloud / clustered deployments should create this index via their
# usual index-management process if policy does not allow app-shipped indexes.

[zentra_validate]
homePath   = $SPLUNK_DB/zentra_validate/db
coldPath   = $SPLUNK_DB/zentra_validate/colddb
thawedPath = $SPLUNK_DB/zentra_validate/thaweddb
frozenTimePeriodInSecs = 31536000
repFactor = auto

[weather]
homePath   = $SPLUNK_DB/weather/db
coldPath   = $SPLUNK_DB/weather/colddb
thawedPath = $SPLUNK_DB/weather/thaweddb
frozenTimePeriodInSecs = 31536000
repFactor = auto
